# --- HELM INSTALL ------
- name: Check if helm exists
  command: which helm
  register: helm_check
  ignore_errors: true
  changed_when: false

- name: Download Helm
  get_url:
    url: https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz
    dest: /tmp/helm.tar.gz
  when: helm_check.rc != 0

- name: Extract Helm
  unarchive:
    src: /tmp/helm.tar.gz
    dest: /tmp
    remote_src: yes
  when: helm_check.rc != 0

- name: Install Helm binary
  copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: '0755'
    remote_src: yes
  when: helm_check.rc != 0


# --- HELM REPO ---
- name: Add Helm repo
  command: /usr/local/bin/helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"

- name: Update Helm repo
  command: /usr/local/bin/helm repo update
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"


# --- CHECK RELEASE ---
- name: Check existing Helm releases
  command: /usr/local/bin/helm list -n monitoring -q
  register: helm_releases
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"

- name: Show release version of Helm
  debug:
    msg: "{{ helm_releases.stdout_lines }}"

  
# --- INSTALL ---
- name: Install monitoring stack
  command: >
    /usr/local/bin/helm install monitoring prometheus-community/kube-prometheus-stack
    -n monitoring --create-namespace
  when: "'monitoring' not in helm_releases.stdout_lines"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"


# --- UPGRADE ---
- name: Upgrade monitoring stack
  command: >
    /usr/local/bin/helm upgrade monitoring prometheus-community/kube-prometheus-stack
    -n monitoring
  when: "'monitoring' in helm_releases.stdout_lines"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"


# --- WAIT GRAFANA ---
- name: Wait for Grafana deployment
  command: kubectl -n monitoring rollout status deployment monitoring-grafana
  register: grafana_ready
  retries: 30
  delay: 10
  until: grafana_ready.rc == 0
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf


# --- WAIT PROMETHEUS ---
- name: Wait for Prometheus pods
  command: kubectl get pods -n monitoring
  register: prometheus_ready
  retries: 30
  delay: 10
  until: prometheus_ready.stdout is search("Running")
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf


- import_tasks: ingress_monitoring.yml
